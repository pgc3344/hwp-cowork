[project]
name = "hwp-cowork"
version = "0.1.0"
description = "한글(.hwp/.hwpx) 조사·편집 MCP 서버 — 사람과 AI 가 같이 고친다. 원본은 읽기만, 편집은 샌드박스 판(v1, v2 …), rhwp 전체 기능"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=2.0",
    "starlette>=0.40",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "PyJWT[crypto]>=2.9",
]

[project.scripts]
hwp-cowork = "hwp_cowork.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hwp_cowork"]
include = ["src/hwp_cowork/static/**", "src/hwp_cowork/templates/**"]
